vla_perception:
  ros__parameters:
    scene_topic: /vla/scene
    annotated_topic: /vla/perception/annotated_image

    # The fixed D435i that cobot2_ws's pick_fsm also uses (shared hardware,
    # confirmed 2026-08-10). Subscribed, not opened directly -- two independent
    # V4L2 opens of the same RealSense device race (2026-08-11 finding,
    # docs/context/constraints.md "카메라 구성"). Whoever launches
    # realsense2_camera (cobot2_ws when integrated, this ws's own launch when
    # run standalone) owns the device; this is just a subscriber.
    image_topic: /camera/camera/color/image_raw
    # Inference is synchronous, so this is an upper bound: a frame slower than
    # the tick just delays the next one rather than piling up work.
    capture_rate_hz: 15.0
    # A frame older than this is a real position for an object that has since
    # moved -- withheld rather than published stale.
    max_image_age_s: 2.0

    # Written by 'ros2 run vla_system table_homography_test'. Without it the
    # scene still lists objects, but none of them get a base position.
    calibration_file: ~/.ros/vla_table_homography.json
    # Added to the fitted tabletop height to get the grasp Z, because the robot
    # closes its gripper exactly at the Z it is handed and the homography can
    # only report where the *table* is. A blunt stand-in for object height: one
    # overhead view cannot measure it. Raise it for tall objects.
    grasp_height_offset_m: 0.15
    # Outside the calibrated quadrilateral the homography extrapolates. Keep
    # true so those objects are reported but never given a coordinate.
    require_inside_table: true

    # yolo26s-seg on the discrete NVIDIA GPU. The instance masks are what keep
    # the colour vote and the mapped pixel on the object itself.
    backend: pytorch
    model: ""
    device: cuda:0
    imgsz: 640
    confidence: 0.35
    max_detections: 30
    target_classes:
      - apple
      - banana
      - orange
      - cup
      - bottle
      - wine glass
      - book
      - mouse
      - cell phone
      - remote
      - sports ball
      - teddy bear
      - clock
      - scissors
      - knife
    excluded_classes:
      - person
    classify_color: true
    # Use the instance masks for the colour vote and for the pixel that gets
    # mapped onto the table, instead of the bounding box. Set false to go back
    # to boxes (also the automatic behaviour if the model has no masks).
    use_masks: true
    torch_threads: 4
    publish_annotated: true

    tracker_iou_threshold: 0.3
    tracker_max_missed_frames: 5
    velocity_smoothing: 0.5
    report_interval: 5.0

vla_wrist:
  ros__parameters:
    # The RealSense on the wrist. YOLO-seg tracks continuously during the
    # observation move; GraspGenX still runs exactly once, after class and
    # base-frame coordinate agree with the fixed-webcam target.
    color_topic: /camera/camera/color/image_raw
    depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/camera/aligned_depth_to_color/camera_info
    grasp_request_topic: /vla/grasp/request
    grasp_plan_topic: /vla/grasp/plan
    tcp_pose_topic: /vla/robot/tcp_pose
    annotated_topic: /vla/wrist/annotated_image
    annotate_rate_hz: 5.0
    tracking_rate_hz: 10.0
    # Long enough to cover the observation motion plus the robot-side 8s wait.
    tracking_timeout_s: 45.0
    frame_buffer_size: 12
    # Measured aligned RGB-D stamps are identical, so 5ms stays below one 30Hz
    # frame interval and cannot pair a color frame with the previous depth.
    # Moving TCP is sampled at 10Hz, hence its larger bracketed-nearest gate.
    rgbd_sync_tolerance_s: 0.005
    tcp_sync_tolerance_s: 0.15
    # Do not commit a grasp on one lucky/misclassified frame.
    stable_match_frames: 3
    stable_match_max_jump_m: 0.02
    stable_match_max_gap_s: 0.35
    tracking_report_interval_s: 1.0

    # cv2.calibrateHandEye output: maps camera coordinates into the gripper
    # frame, in mm. Only valid for the TCP it was recorded with -- the node
    # errors loudly if vla_robot reports a different one.
    handeye_calibration: ""      # empty = the package's T_gripper2camera.npy
    expected_tcp_name: GripperDA_v1
    integer_depth_scale_mm: 1.0

    backend: pytorch
    model: ""
    device: cuda:0
    imgsz: 640
    confidence: 0.35
    max_detections: 30
    # Same list the webcam uses. Empty (every COCO class) let a close-up of the
    # tabletop come back as "bed", which is noise at best: a class the webcam can
    # never name cannot match anything, and it crowds the detection budget.
    target_classes:
      - apple
      - banana
      - orange
      - cup
      - bottle
      - wine glass
      - book
      - mouse
      - cell phone
      - remote
      - sports ball
      - teddy bear
      - clock
      - scissors
      - knife
    excluded_classes:
      - person
    torch_threads: 4

    # "Is this the object the webcam meant?" Horizontal only: the webcam's Z is
    # the table plane plus grasp_height_offset_m while the wrist measures the
    # real surface, so comparing Z would reject every correct match.
    match_tolerance_m: 0.06
    match_max_vertical_gap_m: 0.30
    # Two of the same class equally close is a coin flip. Refuse instead.
    refuse_ambiguous_match: true

    graspgen_repo: ""            # empty = GRASPGENX_ROOT or the installed package
    gripper_name: onrobot_RG2    # built-in; type revolute_2f, fingertip 180mm
    num_grasps: 200
    topk_num_grasps: 20
    min_grasp_confidence: 0.3
    # Stands in for collision checking until there is a motion planner: a grasp
    # reaching in sideways is the one most likely to drag the wrist through
    # something. 0 deg is straight down.
    max_approach_tilt_deg: 45.0
    # Backed off along the approach axis for the pregrasp. RG2's own config
    # suggests up to 0.04.
    standoff_m: 0.04
    min_cloud_points: 200
    max_cloud_points: 20000
    min_depth_mm: 100.0
    max_depth_mm: 1500.0

    workspace_min_x_m: 0.2
    workspace_max_x_m: 0.9
    workspace_min_y_m: -0.6
    workspace_max_y_m: 0.6
    workspace_min_z_m: 0.02
    workspace_max_z_m: 0.8

vla_agent:
  ros__parameters:
    utterance_topic: /vla/user_utterance
    scene_topic: /vla/scene
    robot_state_topic: /vla/robot/state
    action_topic: /vla/robot/action
    stop_topic: /vla/robot/stop
    estop_topic: /vla/estop
    reply_topic: /vla/agent/reply

    model: gpt-5-mini
    stt_model: gpt-4o-transcribe
    env_file: ""
    request_timeout_s: 30.0
    # Tool rounds inside one decision. Enough for "wrong id -> correct it ->
    # act", not enough for a runaway loop.
    max_tool_rounds: 4
    # Conversation items kept before old turns are dropped from the front.
    max_history_items: 60
    # Consecutive non-succeeded actions before auto-continue stops and the
    # agent asks the user instead of retrying forever.
    max_consecutive_failures: 3
    continue_after_action: true
    # Tier 1 -- 규칙 계층. 기본은 꺼짐이라 켜기 전까지 이 노드는
    # 예전과 똑같이 동작한다. 되돌리기가 revert가 아니라 파라미터다.
    skill_tier_enabled: false
    rule_store_path: "~/.ros/vla_rules.json"

vla_robot:
  ros__parameters:
    action_topic: /vla/robot/action
    stop_topic: /vla/robot/stop
    estop_topic: /vla/estop
    state_topic: /vla/robot/state
    scene_topic: /vla/scene

    motion_enabled: false
    robot_id: dsr01
    robot_model: m0609
    # Named controller presets, applied at startup. tcp_name MUST be the TCP the
    # wrist hand-eye calibration was recorded with (data_recording.py used
    # "GripperDA_v1"): get_current_posx() reports whichever TCP the controller
    # currently holds, so a mismatch silently shifts every computed coordinate.
    tool_name: "Tool Weight"
    tcp_name: "GripperDA_v1"

    # Wrist-guided grasping: approach on the webcam position, then let the wrist
    # RealSense + GraspGenX decide the actual 6-DOF grasp. Set false to use the
    # webcam position directly, which is the pre-GraspGenX behaviour.
    use_wrist_grasp: true
    # How high above the object the arm parks so the wrist camera can see it.
    # Must clear the gripper's own 190 mm length.
    observe_height_m: 0.25
    # The camera is mounted about 84mm to the side of the selected TCP. When a
    # direct TCP-over-object pose is outside the M0609's kinematic volume, the
    # robot uses this calibration to rotate that offset outward and keep the
    # camera up to 140mm inward of the object (still inside the D435 view).
    handeye_calibration: ""      # empty = package T_gripper2camera.npy
    observe_camera_inset_max_m: 0.14
    observe_camera_inset_step_m: 0.02
    # Doosan Ikin may return an approximate pose with success=true even when
    # movel will later raise alarm 1206. Require an IK->FK round trip this close.
    observe_ik_position_tolerance_m: 0.005
    observe_ik_orientation_tolerance_deg: 2.0
    # Camera-aware positioning assumes the optical axis is already looking
    # down. Fail closed after an arbitrary tilted grasp/release pose.
    observe_max_camera_tilt_deg: 10.0
    # Lift vertically before the alternate joint-space move so the wrist and
    # gripper do not sweep through objects on the table.
    observe_transition_z_m: 0.28
    wrist_grasp_timeout_s: 8.0
    # If the wrist cannot plan (object out of frame, depth holes, everything
    # filtered), fall back to the webcam-position grasp rather than failing.
    wrist_grasp_fallback: true
    grasp_request_topic: /vla/grasp/request
    grasp_plan_topic: /vla/grasp/plan
    tcp_pose_topic: /vla/robot/tcp_pose
    tcp_pose_sample_period_s: 0.1
    tcp_pose_service_timeout_s: 0.25
    # MoveStop mode: 0=QSTOP_STO, 1=QSTOP, 2=SSTOP, 3=HOLD.
    stop_mode: 2
    max_scene_age_s: 2.0
    # How long one simulated leg of a motion takes when motion_enabled is
    # false. Raise it to leave room to interrupt a dry run by voice.
    dry_run_motion_s: 1.2

    velocity: 30.0
    acceleration: 30.0
    approach_height_m: 0.05
    lift_height_m: 0.05
    place_joints: [0.0, 0.0, 90.0, 0.0, 90.0, 0.0]
    home_joints: [0.0, 0.0, 90.0, 0.0, 90.0, 0.0]
    # How often the async motion is polled. This is also the worst-case delay
    # between a stop being requested and the motion loop noticing.
    poll_interval_s: 0.02
    motion_start_grace_s: 0.3
    motion_timeout_s: 30.0
    # Async service acceptance is not motion completion. Verify the measured
    # TCP/joints after every leg so a rejected command can never be treated as
    # a successful observe, descent, grasp, place, or home motion.
    motion_position_tolerance_m: 0.01
    motion_orientation_tolerance_deg: 3.0
    motion_joint_tolerance_deg: 1.0

    workspace_min_x_m: 0.2
    workspace_max_x_m: 0.9
    workspace_min_y_m: -0.6
    workspace_max_y_m: 0.6
    workspace_min_z_m: 0.02
    workspace_max_z_m: 0.8

    gripper_model: rg2
    gripper_ip: 192.168.1.1
    gripper_port: 502
    gripper_force_n: 40.0
    grip_settle_s: 0.5

vla_pick_bridge:
  ros__parameters:
    action_topic: /vla/robot/action
    stop_topic: /vla/robot/stop
    estop_topic: /vla/estop
    state_topic: /vla/robot/state
    scene_topic: /vla/scene
    # cobot2_ws's vla_command_node -- a different process in a different git
    # clone. These two must match its command_topic/result_topic defaults
    # exactly (voice_processing/vla_command_node.py). Same machine only, per
    # the current same-PC architecture (docs/state.md "cobot2_ws 통합" #2 --
    # still needs its own confirmation).
    pick_command_topic: /vla/pick_command
    pick_result_topic: /vla/pick_result
    max_scene_age_s: 2.0
    # cobot2_ws's own wait_timeout_sec default is 50s (vla_command_node) --
    # stay above it so a slow-but-real answer is never mistaken for a dead
    # one.
    result_timeout_s: 60.0
    # "Is motion enabled" has no real switch on this side any more -- true
    # because the point of routing through this bridge is that motion really
    # does happen, just on cobot2_ws's arm.
    motion_enabled: true
    # table/discard place values are placeholder joint poses on real hardware
    # as of 2026-08-10, not taught to a safe pose yet (vla-bridge-contract.md
    # #5). Flip this once cobot2_ws confirms they're teach-complete -- do not
    # flip it to unblock a demo.
    allow_unverified_place: false
